<!-- Hindi Server Link -->
<div class="mb-3">
    <label for="hindi_url" class="form-label text-white">IN Hindi Server Link</label>
    <input type="url" 
           class="form-control" 
           id="hindi_url" 
           name="hindi_url" 
           placeholder="https://... (Embed Link)" 
           value="{{ anime.hindi_url if anime else '' }}" 
           required>
</div>

<!-- English Server Link -->
<div class="mb-3">
    <label for="english_url" class="form-label text-white">GB English Server Link</label>
    <input type="url" 
           class="form-control" 
           id="english_url" 
           name="english_url" 
           placeholder="https://... (Embed Link)" 
           value="{{ anime.english_url if anime else '' }}" 
           required>
</div>
